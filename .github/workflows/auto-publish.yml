name: Auto Publish SEO Matrix Articles

on:
  schedule:
    # 每 4 天自动运行一次 (UTC 03:00 / 北京时间 11:00)
    - cron: '0 3 */4 * *'
  # 支持在 GitHub 仓库界面手动一键触发测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SEO/GEO Matrix Article via DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/auto-publish-matrix.mjs

      - name: Validate Build and Schema Integrity
        run: npm run build

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          
          # 检查是否有新生成的文章需要提交
          if git diff --staged --quiet; then
            echo "No new articles staged to commit."
            exit 0
          fi
          
          # 注意：提交信息中绝不包含 [skip ci]，确保触发 Cloudflare Pages 自动构建与部署上线
          COMMIT_DATE=$(date +'%Y-%m-%d')
          git commit -m "chore(content): auto-publish weekly SEO matrix article ${COMMIT_DATE}"
          git push origin main
